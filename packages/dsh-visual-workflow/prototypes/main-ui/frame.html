<!doctype html>
<html lang="zh-CN" data-platform="darwin">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工作流预览</title>
  <link rel="stylesheet" href="/reference/host-base.css">
  <link rel="stylesheet" href="/reference/host-theme.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body data-prototype-frame>
  <div class="host-backdrop" aria-hidden="true">
    <aside class="host-rail"><span>⌘</span><span>＋</span><span>☷</span></aside>
    <main class="host-home"><div><h1>有什么可以帮忙的？</h1><p>工作流插件 · 本地网页原型</p></div></main>
  </div>
  <button class="host-show-settings">打开工作流设置</button>
  <div class="host-mask"></div>
  <section class="host-settings" aria-label="设置">
    <nav class="host-settings-nav" aria-label="设置分类">
      <div class="host-settings-title">设置</div>
      <div class="host-nav-list">
        <div class="host-nav-item"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16M8 4v6M16 9v6M10 14v6"/></svg>通用</div>
        <div class="host-nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>账号</div>
        <div class="host-nav-item"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg>模型</div>
        <div class="host-nav-item active" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M6 9v9h9M15 6h3v9"/></svg>工作流</div>
        <div class="host-nav-item"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12h8M12 8v8"/></svg>插件</div>
      </div>
    </nav>
    <div class="host-settings-content">
      <header class="host-settings-header"><button class="host-settings-close" aria-label="关闭设置">×</button></header>
      <div class="host-options"><div id="plugin-root"></div></div>
    </div>
  </section>
  <script type="module" src="__BUNDLE_SOURCE__"></script>
</body>
</html>
