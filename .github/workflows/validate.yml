name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: generate（生产物供校验与 vwf 加载）
        run: npm run generate
      - name: validate（蓝图校验 + 等价断言 + 重生成一致性 + 测试）
        run: npm run validate
