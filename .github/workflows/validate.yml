name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 收口链用例（local-task-merge 系列）会经产品代码执行真实 `git commit`，
      # 而产品代码不覆盖子进程 env（local-task-merge.mjs:50），身份只能来自环境。
      # Linux runner 不像 macOS 会由 username/hostname 自动推导身份，
      # 缺这条会报 `Author identity unknown`，7 个用例在 CI 上永不通过。
      - name: 配置 git 提交身份（供收口链用例做真实 commit）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: install（workspace 提升 packages/* 依赖）
        run: npm install
      - name: generate（生产物供校验与 vwf 加载）
        run: npm run generate
      # 【临时诊断，定位后即移除】M4 在 CI 上间歇失败（本地恒过），且 validate.mjs 会裁剪
      # 明细。此处保留完整输出，并单独复现「批次前对账」段的生成，取回报告原文。
      - name: 诊断：M4 取证（完整输出 + 报告原文）
        continue-on-error: true
        run: |
          echo "===== 1) 直接跑 M4 检查脚本 ====="
          node scripts/ai-task-scheduled-m4-check.mjs || true
          echo "===== 2) 单独跑 trigger --now 并打印报告原文 ====="
          mkdir -p /tmp/m4probe
          printf '%s' '{"runAt":"2020-01-01T00:00:00.000Z","batch":"scripts/test/fixtures/ai-task-scheduled-m4/batch.json","simulate":"scripts/test/fixtures/ai-task-scheduled-m4/events-scene1.json","reportOut":"/tmp/m4probe/report.md"}' > /tmp/m4probe/sched.json
          node scripts/ai-task-scheduled-trigger.mjs /tmp/m4probe/sched.json --now > /tmp/m4probe/out.json 2> /tmp/m4probe/err.txt || true
          echo "----- trigger stderr -----"; cat /tmp/m4probe/err.txt || true
          echo "----- 报告原文（批次前对账段应在此）-----"; cat /tmp/m4probe/report.md || true
      - name: validate（蓝图校验 + 重生成一致性 + 引擎/包测试（含运行时排练厅））
        run: npm run validate
