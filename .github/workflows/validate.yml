name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 收口链用例（local-task-merge 系列）会经产品代码执行真实 `git commit`，
      # 而产品代码不覆盖子进程 env（local-task-merge.mjs:50），身份只能来自环境。
      # Linux runner 不像 macOS 会由 username/hostname 自动推导身份，
      # 缺这条会报 `Author identity unknown`，7 个用例在 CI 上永不通过。
      - name: 配置 git 提交身份（供收口链用例做真实 commit）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: install（workspace 提升 packages/* 依赖）
        run: npm install
      - name: generate（生产物供校验与 vwf 加载）
        run: npm run generate
      # 【临时诊断，定位后即移除】M4 在 CI 上间歇失败（本地恒过），且 validate.mjs 会裁剪
      # 明细。此处单跑 3 次并保留完整 stdout/stderr，用于区分「稳定断言失败」与「并发竞态」。
      - name: 诊断：单独运行 M4 机械验收脚本 3 次（完整输出）
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            echo "===== M4 run $i ====="
            node scripts/ai-task-scheduled-m4-check.mjs
            echo "M4 exit=$?"
          done
      - name: validate（蓝图校验 + 重生成一致性 + 引擎/包测试（含运行时排练厅））
        run: npm run validate
