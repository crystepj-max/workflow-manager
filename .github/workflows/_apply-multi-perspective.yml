name: Apply multi-perspective built-ins

on:
  push:
    branches:
      - feat/multi-perspective-exploration

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/multi-perspective-exploration

      - name: Patch built-in registry and tests
        run: node scripts/_apply-multi-perspective.mjs

      - name: Commit registry patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: register multi-perspective roles as built-in"
          git push origin HEAD:feat/multi-perspective-exploration

      - name: Install dependencies
        run: npm ci

      - name: Generate built-in artifacts
        run: npm run generate

      - name: Run visual workflow tests
        working-directory: packages/dsh-visual-workflow
        run: npm test
